name: Adapt SLA PR to current main

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/xc-sla-dynamic-batching-scheduler
          fetch-depth: 0

      - name: Merge upstream main and reapply SLA changes
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Keep the pre-merge fork scheduler; the SLA implementation is recovered from it.
          cp python/sglang/srt/managers/scheduler.py /tmp/old_scheduler.py

          git remote add upstream https://github.com/sgl-project/sglang.git
          git fetch --no-tags upstream +main:refs/remotes/upstream/main

          if git merge --no-edit upstream/main; then
            echo "merge completed without conflicts"
          else
            echo "merge has conflicts; taking the upstream side"
            git diff --name-only --diff-filter=U > /tmp/unmerged.txt || true
            while IFS= read -r f; do
              if [ -z "$f" ]; then continue; fi
              if git checkout --theirs -- "$f" 2>/dev/null; then
                git add -- "$f"
              else
                git rm -f -- "$f" || true
              fi
            done < /tmp/unmerged.txt
          fi

          # Deterministically use current main for the two files the old PR touched.
          git checkout upstream/main -- python/sglang/srt/managers/scheduler.py python/sglang/srt/server_args.py

          git diff --name-only --diff-filter=U > /tmp/left.txt || true
          if [ -s /tmp/left.txt ]; then
            echo "unmerged files remain:"
            cat /tmp/left.txt
            exit 1
          fi
          git add -A
          git commit -m "Merge sgl-project/main into SLA branch" || true

          python3 - <<'PYEOF'
          import ast
          import os
          from pathlib import Path

          SCHED = Path("python/sglang/srt/managers/scheduler.py")
          FIELDS = Path("python/sglang/srt/arg_groups/fields/schedule.py")
          OLD = Path(os.environ.get("OLD_SCHEDULER", "/tmp/old_scheduler.py"))


          def sub_once(text, old, new, label):
              n = text.count(old)
              if n != 1:
                  raise SystemExit("%s: expected 1 occurrence, found %d" % (label, n))
              return text.replace(old, new, 1)


          def L(*lines):
              return "\n".join(lines) + "\n"


          # ---------------------------------------------------------------------------
          # 1. Recover the SLA implementation from the pre-merge fork scheduler.
          # ---------------------------------------------------------------------------
          old = OLD.read_text()
          START = (
              "    # =============================================================================\n"
              "    # SLA (Service Level Agreement) Constrained Dynamic Batching"
          )
          END = "    def init_req_max_new_tokens(self, req):"
          if START not in old or END not in old:
              raise SystemExit("SLA markers missing in pre-merge scheduler")
          i = old.index(START)
          j = old.index(END, i)
          block = old[i:j]

          # ---------------------------------------------------------------------------
          # 2. Port legacy APIs to the current main architecture.
          # ---------------------------------------------------------------------------
          block = block.replace(
              "get_global_server_args().pp_max_micro_batch_size",
              "get_parallel().pp_max_micro_batch_size",
          )
          block = block.replace("self.ps.pp_size", "get_parallel().pp_size")
          block = block.replace("self.ps.tp_rank", "get_parallel().tp_rank")
          if "self.ps" in block or "get_global_server_args" in block:
              raise SystemExit("legacy API still present in SLA block")

          # ---------------------------------------------------------------------------
          # 3. Reapply into current main's scheduler.
          # ---------------------------------------------------------------------------
          t = SCHED.read_text()
          if "SLA (Service Level Agreement) Constrained Dynamic Batching" in t:
              raise SystemExit("SLA block already present; refusing to duplicate")
          t = sub_once(t, END, block + END, "sla block")

          INIT = "        self.is_initializing = False\n"
          t = sub_once(
              t,
              INIT,
              "        # Init SLA dynamic batching\n        self.init_sla_constraint()\n\n" + INIT,
              "init hook",
          )

          ALLOC_OLD = L(
              "            res = min(res, row_budget // beam_width)",
              "",
              "        return res",
          )
          ALLOC_NEW = L(
              "            res = min(res, row_budget // beam_width)",
              "",
              "        # SLA: keep the architecture's own budgets and additionally respect",
              "        # the latency/memory bounded batch size.",
              "        if getattr(self, \"enable_sla_constraint\", False):",
              "            res = min(",
              "                res,",
              "                self.get_num_allocatable_reqs_sla(",
              "                    running_bs, self.max_running_requests",
              "                ),",
              "            )",
              "            res = max(0, res)",
              "",
              "        return res",
          )
          t = sub_once(t, ALLOC_OLD, ALLOC_NEW, "alloc hook")

          URB_HEAD = L(
              "        initial_bs = batch.batch_size()",
              "",
              "        finishing_reqs = self._reqs_finishing_inflight(batch)",
          )
          URB_HEAD_NEW = L(
              "        initial_bs = batch.batch_size()",
              "",
              "        # SLA: clear per-step timing state on every path, including early returns.",
              "        if getattr(self, \"enable_sla_constraint\", False):",
              "            self.current_batch_start_time = None",
              "            self.current_decode_batch_size = 0",
              "",
              "        finishing_reqs = self._reqs_finishing_inflight(batch)",
          )
          t = sub_once(t, URB_HEAD, URB_HEAD_NEW, "update head")

          URB_TAIL = L(
              "        if batch.is_empty():",
              "            return batch",
              "",
              "        # Update batch tensors",
              "        batch.prepare_for_decode()",
              "        return batch",
          )
          URB_TAIL_NEW = L(
              "        if batch.is_empty():",
              "            return batch",
              "",
              "        # SLA: adaptive decode batch-size limit and latency sampling. Placed",
              "        # after main's own resets so the flag is not overwritten.",
              "        if getattr(self, \"enable_sla_constraint\", False) and batch.forward_mode.is_decode():",
              "            sla_max_running_reqs = self._update_sla_bounds()",
              "            current_bs = batch.batch_size()",
              "            if current_bs > sla_max_running_reqs:",
              "                logger.warning(",
              "                    f\"[SLA-Limit] bs={current_bs} > sla_max={sla_max_running_reqs}, marking batch full\"",
              "                )",
              "                batch.batch_is_full = True",
              "                self.new_token_ratio_tracker.current = min(",
              "                    self.new_token_ratio_tracker.current * self.SLA_TOKEN_RATIO_BOOST,",
              "                    self.new_token_ratio_tracker.init,",
              "                )",
              "            else:",
              "                batch.batch_is_full = False",
              "            self.current_batch_start_time = time.perf_counter()",
              "            self.current_decode_batch_size = current_bs",
              "",
              "        # Update batch tensors",
              "        batch.prepare_for_decode()",
              "        return batch",
          )
          t = sub_once(t, URB_TAIL, URB_TAIL_NEW, "update tail")

          PBR_OLD = L(
              "        self.deferred_responses.stream_released()",
              "        # Flush async trace ops here: in overlap mode this CPU work runs while",
          )
          PBR_NEW = L(
              "        self.deferred_responses.stream_released()",
              "",
              "        # SLA: record decode latency and batch size for adaptive control.",
              "        if (",
              "            getattr(self, \"enable_sla_constraint\", False)",
              "            and getattr(self, \"current_batch_start_time\", None) is not None",
              "            and batch.forward_mode.is_decode()",
              "        ):",
              "            latency = time.perf_counter() - self.current_batch_start_time",
              "            self.latency_history.append(latency)",
              "            self.batch_history.append(self.current_decode_batch_size)",
              "            self.current_batch_start_time = None",
              "",
              "        # Flush async trace ops here: in overlap mode this CPU work runs while",
          )
          t = sub_once(t, PBR_OLD, PBR_NEW, "process_batch_result hook")

          ast.parse(t)
          SCHED.write_text(t)

          # ---------------------------------------------------------------------------
          # 4. Declare the SLA CLI fields in the new namespace layout.
          # ---------------------------------------------------------------------------
          FIELDS_SPEC = [
              ("enable_sla_constraint", "bool", "False", "Enable SLA-constrained dynamic batching during decode phase."),
              ("sla_latency", "float", "0.05", "Target SLA decode latency D_SLA in seconds (default: 0.05s = 50ms)."),
              ("sla_epsilon", "float", "0.01", "SLA tolerance epsilon_D in seconds, defines the acceptable latency range (default: 0.01s = 10ms)."),
              ("sla_alpha", "int", "20", "Minimum search-interval width alpha in the SLA algorithm (default: 20)."),
              ("sla_sigma", "int", "5", "Conservative corrective step size delta in the SLA algorithm (default: 5)."),
              ("sla_max_change_per_step", "int", "10", "Maximum batch size change per step to prevent oscillation (default: 10)."),
              ("batch_size_lower", "int", "4", "Hard lower bound B_min for the SLA search space (default: 4)."),
              ("batch_size_upper", "int", "256", "Hard upper bound B_max for the SLA search space (default: 256)."),
              ("sla_avg_tokens_per_req", "int", "50", "Average tokens per request for KV cache memory estimation (default: 50)."),
              ("sla_max_growth_rate", "float", "1.2", "Maximum growth rate of upper bound to prevent overshoot (default: 1.2)."),
          ]

          names = [x[0] for x in FIELDS_SPEC]
          for p in sorted(FIELDS.parent.glob("*.py")):
              if p.name == "__init__.py":
                  continue
              body = p.read_text()
              for n in names:
                  if ("\n    " + n + ":") in body or ("\n    " + n + " =") in body:
                      raise SystemExit("field %r already declared in %s" % (n, p.name))

          lines = [
              "    # -------------------------------------------------------------------------",
              "    # SLA-constrained dynamic batching",
              "    # -------------------------------------------------------------------------",
          ]
          for name, typ, default, help_text in FIELDS_SPEC:
              lines += [
                  "    " + name + ": A[",
                  "        " + typ + ",",
                  '        "' + help_text + '",',
                  "    ] = " + default,
              ]
          sla_fields = "\n".join(lines) + "\n\n"

          f = FIELDS.read_text()
          ANCHOR = '    _NS_PATH = "schedule"\n'
          f = sub_once(f, ANCHOR, ANCHOR + "\n" + sla_fields, "schedule fields")
          ast.parse(f)
          FIELDS.write_text(f)

          print("SLA adaptation applied: %d fields, %d lines of scheduler methods" % (len(FIELDS_SPEC), block.count("\n")))
          PYEOF

          python3 -m py_compile python/sglang/srt/managers/scheduler.py python/sglang/srt/arg_groups/fields/schedule.py
          git add -A
          git commit -m "Reapply SLA-constrained dynamic batching on current main architecture" || true
          git log --oneline -3
          git status --short
          git push origin HEAD:feat/xc-sla-dynamic-batching-scheduler
