name: Adapt SLA PR to current main

on:
  workflow_dispatch:

permissions: write-all

jobs:
  adapt:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/xc-sla-dynamic-batching-scheduler
          fetch-depth: 0

      - name: Rebuild branch on synced upstream main
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp python/sglang/srt/managers/scheduler.py /tmp/old_scheduler.py

          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git remote add upstream https://github.com/sgl-project/sglang.git
          git fetch --no-tags upstream +main:refs/remotes/upstream/main
          BASE=$(git merge-base origin/main upstream/main)
          echo "Rebuild base: $BASE"
          git reset --hard "$BASE"

          echo '' | python3 -c "import sys,base64,zlib,pathlib; pathlib.Path('/tmp/adapt_sla.py').write_bytes(zlib.decompress(base64.b64decode(sys.stdin.read().strip())))"
          python3 /tmp/adapt_sla.py
          python3 -m py_compile python/sglang/srt/managers/scheduler.py python/sglang/srt/arg_groups/fields/schedule.py
          git add python/sglang/srt/managers/scheduler.py python/sglang/srt/arg_groups/fields/schedule.py
          git diff --cached --stat
          git commit -m "feat: SLA-constrained dynamic batching on current main architecture"
          git log --oneline -2
          git status --short
          git push --force origin HEAD:feat/xc-sla-dynamic-batching-scheduler
